<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- defer: HTML 파싱이 끝난 뒤 실행되므로 DOMContentLoaded 래퍼가 필요 없음 -->
    <script src="js/todo.js" defer></script>
</head>

<body class="flex min-h-screen items-center bg-gray-200 py-8 font-sans text-gray-900">
    <main id="todo-list" class="mx-auto w-full max-w-md px-4">

        <section id="todo-section1" class="mb-4 rounded-3xl bg-white p-6">
            <p id="todayText" class="text-[15px] font-medium text-gray-500"></p>
            <h1 class="mt-1 text-[26px] font-bold">오늘 할 일</h1>
            <div class="mt-5 flex justify-between text-[15px]">
                <span class="text-gray-500">진행률</span>
                <span id="progressText" class="font-semibold text-blue-500">0개 중 0개 완료</span>
            </div>
            <!-- 회색 막대(바깥) 위에 파란 막대(안쪽). 파란 막대 폭을 JS가 바꿈 -->
            <div id="progressbar" role="progressbar" aria-label="할 일 진행률" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0" class="mt-2 h-2 overflow-hidden rounded-full bg-gray-100">
                <div id="progressFill" class="h-full w-0 rounded-full bg-blue-500 transition-all duration-500"></div>
            </div>
        </section>

        <section id="todo-section2" class="rounded-3xl bg-white p-6">
            <form id="todoForm" class="flex gap-2">
                <label for="todoInput" class="sr-only">할 일 입력</label>
                <input type="text" id="todoInput" maxlength="100" autocomplete="off" placeholder="할 일을 입력해 주세요."
                    class="h-14 min-w-0 flex-1 rounded-2xl bg-gray-50 px-4 text-[17px] outline-none placeholder:text-gray-400 focus:ring-2 focus:ring-blue-500">

                <button id="addButton" type="submit"
                    class="button-press h-14 rounded-2xl bg-blue-500 px-5 font-semibold text-white hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-blue-500">추가</button>
            </form>

            <!-- 조회: 전체 / 진행 중 / 완료 필터. 선택 상태는 aria-pressed 로 표현하고 스타일은 CSS 변형(variant)이 처리 -->
            <nav id="filterBar" aria-label="할 일 보기 필터" class="mt-4 flex gap-2">
                <button type="button" data-filter="all" aria-pressed="true"
                    class="filter-btn button-press rounded-full bg-gray-100 px-4 py-1.5 text-[14px] font-medium text-gray-500 hover:bg-gray-200 aria-pressed:bg-blue-500 aria-pressed:text-white aria-pressed:hover:bg-blue-600">전체</button>
                <button type="button" data-filter="active" aria-pressed="false"
                    class="filter-btn button-press rounded-full bg-gray-100 px-4 py-1.5 text-[14px] font-medium text-gray-500 hover:bg-gray-200 aria-pressed:bg-blue-500 aria-pressed:text-white aria-pressed:hover:bg-blue-600">진행
                    중</button>
                <button type="button" data-filter="done" aria-pressed="false"
                    class="filter-btn button-press rounded-full bg-gray-100 px-4 py-1.5 text-[14px] font-medium text-gray-500 hover:bg-gray-200 aria-pressed:bg-blue-500 aria-pressed:text-white aria-pressed:hover:bg-blue-600">완료</button>
            </nav>

            <ul id="todoList" class="mt-3 flex flex-col"></ul>
            <p id="empty-message" class="whitespace-pre-line py-10 text-center text-[15px] text-gray-400"></p>

            <!-- 완료한 일이 있을 때만 보이는 버튼 -->
            <button id="clearButton" type="button"
                class="button-press mt-2 w-full rounded-2xl py-3 text-[15px] font-medium text-gray-500 hover:bg-gray-50">
                완료한 일 지우기
            </button>
        </section>
    </main>
</body>

</html>
